<meta charset="utf-8">
<style>
  /* UI3. Colour comes from Figma's own theme tokens, which showUI({themeColors:
     true}) injects into this iframe, so the plugin follows the editor's light/dark
     setting instead of guessing.
     Every token is aliased once here with a hardcoded fallback, and the dark
     block re-aliases the same names against `html.figma-dark` — the class Figma
     adds. So if a --figma-color-* name is ever wrong or unavailable, the fallback
     is still theme-correct rather than a white panel in a dark editor. Nothing
     below this block references --figma-color-* directly. */
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-tertiary: var(--figma-color-bg-tertiary, #e6e6e6);
    --bg-hover: var(--figma-color-bg-hover, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --text-secondary: var(--figma-color-text-secondary, #5c5c5c);
    --text-tertiary: var(--figma-color-text-tertiary, #b3b3b3);
    --border: var(--figma-color-border, #e6e6e6);
    --border-strong: var(--figma-color-border-strong, #767676);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #f24822);
    --danger-border: var(--figma-color-border-danger-strong, #f24822);
    --danger-bg: var(--figma-color-bg-danger-tertiary, #fee9e7);
    --disabled-bg: var(--figma-color-bg-disabled, #e6e6e6);
    --disabled-text: var(--figma-color-text-disabled, #b3b3b3);
  }

  html.figma-dark {
    --bg: var(--figma-color-bg, #2c2c2c);
    --bg-secondary: var(--figma-color-bg-secondary, #383838);
    --bg-tertiary: var(--figma-color-bg-tertiary, #444444);
    --bg-hover: var(--figma-color-bg-hover, #383838);
    --text: var(--figma-color-text, #ffffff);
    --text-secondary: var(--figma-color-text-secondary, #b3b3b3);
    --text-tertiary: var(--figma-color-text-tertiary, #757575);
    --border: var(--figma-color-border, #444444);
    --border-strong: var(--figma-color-border-strong, #9c9c9c);
    --danger: var(--figma-color-text-danger, #ffafa3);
    --danger-border: var(--figma-color-border-danger-strong, #ffafa3);
    --danger-bg: var(--figma-color-bg-danger-tertiary, #3d2321);
    --disabled-bg: var(--figma-color-bg-disabled, #444444);
    --disabled-text: var(--figma-color-text-disabled, #757575);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 11px/1.45 Inter, "Inter var", -apple-system, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* Form scrolls, actions stay put — 11 hex rows never push Create out of reach. */
  .scroll { flex: 1; overflow-y: auto; padding: 12px 12px 16px; }

  .section + .section { margin-top: 16px; }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.005em;
  }
  .head .hint { font-weight: 400; color: var(--text-tertiary); }

  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  .col { flex: 1; min-width: 0; }
  .col.narrow { flex: 0 0 68px; }

  label { display: block; margin-bottom: 4px; color: var(--text-secondary); }

  /* UI3 field: transparent until you touch it, 1px inset ring on focus. */
  input[type="text"], input[type="number"] {
    width: 100%;
    height: 32px;
    padding: 0 8px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    font: inherit;
    outline: none;
  }
  input[type="text"]:hover, input[type="number"]:hover { border-color: var(--border-strong); }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--brand);
    box-shadow: inset 0 0 0 1px var(--brand);
  }
  input.invalid { border-color: var(--danger-border); }
  input.invalid:focus { box-shadow: inset 0 0 0 1px var(--danger-border); }
  input::placeholder { color: var(--text-tertiary); }
  /* Steppers are noise at this size; arrow keys still work. */
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* A field with a colour chip parked inside it, UI3-style, instead of a
     detached square floating beside the input. */
  .field { position: relative; flex: 1; min-width: 0; }
  /* Scoped to the text input on purpose: the color input in this field must not
     inherit the gutter padding or the mono stack. */
  .field input[type="text"] { padding-left: 28px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .swatch {
    position: absolute;
    left: 9px;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border-radius: 3px;
    background: var(--bg-tertiary);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    pointer-events: none;
  }

  /* An invisible trigger over the 28px gutter that .field input[type="text"]
     already reserves. The visible chip stays the #base-swatch div, so the themed
     empty state survives — a real color input cannot show "empty", it would show
     black and imply the user picked black.
     At opacity 0 nothing is drawn, so there is no appearance/border/background
     to reset; cursor and hit-testing still apply, which is the whole trick.
     padding IS load-bearing: * { box-sizing: border-box } keeps the inherited
     padding inside the 28px, which would leave a zero-width content box. */
  .field .picker {
    position: absolute;
    left: 0;
    top: 0;
    width: 28px;
    height: 100%;
    padding: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* The chip is the click target and gave no sign of it — the reason the human
     partner reloaded the plugin and reported the picker missing. The cue rides on
     the picker's own :hover, not .swatch:hover, because the chip keeps
     pointer-events: none and never receives hover itself. :has() scopes it to the
     field so hovering the text half stays silent; where :has() is unsupported the
     ring simply never appears, which is the same silent-degradation bargain the
     invisible trigger already makes.
     :focus-visible earns its place: a keyboard user tabbing onto a control that
     draws nothing has no way to know they are on it. */
  .field:has(.picker:hover) .swatch,
  .field:has(.picker:focus-visible) .swatch {
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }

  button {
    height: 32px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: var(--brand);
    color: var(--on-brand);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--brand-hover); }
  button:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: default; }
  button.secondary {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border-strong);
  }
  button.secondary:hover { background: var(--bg-hover); }
  button.secondary:disabled { background: var(--bg); color: var(--disabled-text); border-color: var(--border); }
  button.block { width: 100%; }

  /* Resting-state cue for the base field and Use selection: a hover ring on
     the chip tells you nothing until you've found it to hover. */
  .field-hint { margin-top: 8px; color: var(--text-tertiary); }

  #hexes { margin-top: 8px; }
  .hex-row { display: flex; align-items: center; gap: 8px; }
  .hex-row + .hex-row { margin-top: 6px; }
  .hex-row .step {
    flex: 0 0 62px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Fill rewrites every row at once — a beat of movement on the chips is the
     only cue that all eleven changed. */
  .hex-row.filled .swatch { animation: pop 0.3s ease; }
  @keyframes pop {
    0% { transform: scale(0.4); }
    60% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .foot {
    flex: none;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .check input {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 14px;
    height: 14px;
    margin: 0;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    background: var(--bg);
    cursor: pointer;
  }
  .check input:checked { background: var(--brand); border-color: var(--brand); }
  /* Tick drawn from two borders rather than an inlined SVG — no asset, scales
     with the box, and picks up --on-brand automatically. */
  .check input:checked::after {
    content: "";
    display: block;
    width: 3px;
    height: 6px;
    margin: 1px 0 0 4px;
    border: solid var(--on-brand);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(40deg);
  }
  .check label { margin: 0; color: var(--text); cursor: pointer; }

  #status {
    display: none;
    margin-top: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
  }
  #status.shown { display: block; }
  #status.error { background: var(--danger-bg); color: var(--danger); }
</style>

<div class="scroll">
  <div class="section">
    <div class="head">Destination</div>
    <div class="row">
      <div class="col">
        <label for="collection">Collection</label>
        <input id="collection" type="text" placeholder="Colors">
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label for="ramp">Ramp name</label>
        <input id="ramp" type="text" placeholder="gray">
      </div>
      <div class="col narrow">
        <label for="count">Steps</label>
        <input id="count" type="number" min="1" max="11" value="11">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="head">Generate<span class="hint">optional</span></div>
    <div class="row">
      <div class="field">
        <div class="swatch" id="base-swatch"></div>
        <input class="picker" id="base-picker" type="color" value="#ff4252"
               aria-label="Pick a base color" title="Pick a base color">
        <input id="base" type="text" placeholder="#ff4252" aria-label="Base color">
      </div>
      <button id="generate" class="secondary" disabled>Fill</button>
    </div>
    <div class="row">
      <button id="pick" class="secondary">Use selection</button>
    </div>
    <div class="field-hint">click the chip to pick · or take the fill off the selected layer</div>
  </div>

  <div class="section">
    <div class="head">Values<span class="hint" id="range"></span></div>
    <div id="hexes"></div>
  </div>
</div>

<div class="foot">
  <div class="check">
    <input id="sheet" type="checkbox">
    <label for="sheet">Draw swatch sheet</label>
  </div>
  <button id="create" class="block" disabled>Create variables</button>
  <div id="status"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const HEX_RE = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;

  // The standard ramp ladder — note the half-steps at both ends. A count of
  // N takes the first N rungs, so 11 gives the full 50…950.
  const LADDER = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

  function stepName(ramp, i) { return ramp + "/" + LADDER[i]; }

  // figma.util.rgb()'s documented input list doesn't confirm #RGB shorthand,
  // and it throws on strings it can't parse. Expand to 6-digit form before
  // sending so a shorthand value never reaches the main thread. The swatch
  // preview keeps using the raw value — browsers handle shorthand fine.
  function expandHex(value) {
    const m = /^#([0-9a-fA-F])([0-9a-fA-F])([0-9a-fA-F])$/.exec(value);
    return m ? "#" + m[1] + m[1] + m[2] + m[2] + m[3] + m[3] : value;
  }

  // Tailwind v3's palettes, used as reference curves — a ramp's shape (which
  // lightness each step sits at, and how saturation tapers) is lifted from the
  // family nearest the input's hue. Steps run 50 … 950, matching LADDER.
  const TW = {
    neutral: "fafafa f5f5f5 e5e5e5 d4d4d4 a3a3a3 737373 525252 404040 262626 171717 0a0a0a",
    red: "fef2f2 fee2e2 fecaca fca5a5 f87171 ef4444 dc2626 b91c1c 991b1b 7f1d1d 450a0a",
    orange: "fff7ed ffedd5 fed7aa fdba74 fb923c f97316 ea580c c2410c 9a3412 7c2d12 431407",
    amber: "fffbeb fef3c7 fde68a fcd34d fbbf24 f59e0b d97706 b45309 92400e 78350f 451a03",
    yellow: "fefce8 fef9c3 fef08a fde047 facc15 eab308 ca8a04 a16207 854d0e 713f12 422006",
    lime: "f7fee7 ecfccb d9f99d bef264 a3e635 84cc16 65a30d 4d7c0f 3f6212 365314 1a2e05",
    green: "f0fdf4 dcfce7 bbf7d0 86efac 4ade80 22c55e 16a34a 15803d 166534 14532d 052e16",
    emerald: "ecfdf5 d1fae5 a7f3d0 6ee7b7 34d399 10b981 059669 047857 065f46 064e3b 022c22",
    teal: "f0fdfa ccfbf1 99f6e4 5eead4 2dd4bf 14b8a6 0d9488 0f766e 115e59 134e4a 042f2e",
    cyan: "ecfeff cffafe a5f3fc 67e8f9 22d3ee 06b6d4 0891b2 0e7490 155e75 164e63 083344",
    sky: "f0f9ff e0f2fe bae6fd 7dd3fc 38bdf8 0ea5e9 0284c7 0369a1 075985 0c4a6e 082f49",
    blue: "eff6ff dbeafe bfdbfe 93c5fd 60a5fa 3b82f6 2563eb 1d4ed8 1e40af 1e3a8a 172554",
    indigo: "eef2ff e0e7ff c7d2fe a5b4fc 818cf8 6366f1 4f46e5 4338ca 3730a3 312e81 1e1b4b",
    violet: "f5f3ff ede9fe ddd6fe c4b5fd a78bfa 8b5cf6 7c3aed 6d28d9 5b21b6 4c1d95 2e1065",
    purple: "faf5ff f3e8ff e9d5ff d8b4fe c084fc a855f7 9333ea 7e22ce 6b21a8 581c87 3b0764",
    fuchsia: "fdf4ff fae8ff f5d0fe f0abfc e879f9 d946ef c026d3 a21caf 86198f 701a75 4a044e",
    pink: "fdf2f8 fce7f3 fbcfe8 f9a8d4 f472b6 ec4899 db2777 be185d 9d174d 831843 500724",
    rose: "fff1f2 ffe4e6 fecdd3 fda4af fb7185 f43f5e e11d48 be123c 9f1239 881337 4c0519",
  };

  function toRgb(hex) {
    return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  }

  function toHsl(rgb) {
    const max = Math.max.apply(null, rgb);
    const min = Math.min.apply(null, rgb);
    const span = max - min;
    const l = (max + min) / 2;
    let h = 0;
    let s = 0;
    if (span) {
      s = span / (1 - Math.abs(2 * l - 1));
      if (max === rgb[0]) h = 60 * (((rgb[1] - rgb[2]) / span) % 6);
      else if (max === rgb[1]) h = 60 * ((rgb[2] - rgb[0]) / span + 2);
      else h = 60 * ((rgb[0] - rgb[1]) / span + 4);
      if (h < 0) h += 360;
    }
    return [h, s, l];
  }

  function fromHsl(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const sector = h / 60;
    const x = c * (1 - Math.abs((sector % 2) - 1));
    let rgb = [c, 0, x];
    if (sector < 1) rgb = [c, x, 0];
    else if (sector < 2) rgb = [x, c, 0];
    else if (sector < 3) rgb = [0, c, x];
    else if (sector < 4) rgb = [0, x, c];
    else if (sector < 5) rgb = [x, 0, c];
    const m = l - c / 2;
    return (
      "#" +
      rgb
        .map((v) => {
          const byte = Math.round(Math.min(1, Math.max(0, v + m)) * 255);
          return byte.toString(16).padStart(2, "0");
        })
        .join("")
        .toUpperCase()
    );
  }

  // Which family's curve to borrow. Hue picks it, except for near-greys, where
  // hue is meaningless noise and the neutral curve is the honest answer.
  function referenceFor(h, s) {
    if (s < 0.06) return TW.neutral;
    let best = TW.red;
    let bestDistance = 999;
    for (const name in TW) {
      if (name === "neutral") continue;
      const family = TW[name].split(" ");
      // A family's hue is the hue of its 500 — its most saturated anchor.
      const hue = toHsl(toRgb("#" + family[5]))[0];
      let distance = Math.abs(hue - h);
      if (distance > 180) distance = 360 - distance;
      if (distance < bestDistance) {
        bestDistance = distance;
        best = TW[name];
      }
    }
    return best;
  }

  // Builds the full 11-step ramp from one colour, the way UI Colors does:
  // hue is held constant, the reference family supplies each step's lightness,
  // and saturation is the reference's scaled by how much more (or less)
  // saturated the input is than the reference step it landed on. The input
  // keeps its exact value at whichever step its lightness is closest to.
  function generateRamp(baseHex) {
    const base = toHsl(toRgb(baseHex));
    const reference = referenceFor(base[0], base[1])
      .split(" ")
      .map((hex) => toHsl(toRgb("#" + hex)));

    let index = 0;
    let closest = 2;
    reference.forEach((step, i) => {
      const distance = Math.abs(step[2] - base[2]);
      if (distance < closest) {
        closest = distance;
        index = i;
      }
    });

    const anchorSaturation = reference[index][1];
    const ratio = anchorSaturation === 0 ? 0 : base[1] / anchorSaturation;

    return reference.map((step, i) =>
      i === index
        ? baseHex.toUpperCase()
        : fromHsl(base[0], Math.min(1, step[1] * ratio), step[2])
    );
  }

  function countValue() {
    const n = Number($("count").value);
    return Number.isInteger(n) && n >= 1 && n <= LADDER.length ? n : null;
  }

  // Rebuilds the hex rows for the current ramp/count, carrying over
  // already-typed values by position so edits aren't lost.
  function renderHexRows() {
    const ramp = $("ramp").value.trim() || "ramp";
    const n = countValue() || 0;
    const old = [...document.querySelectorAll(".hex-row input")].map((el) => el.value);
    const box = $("hexes");
    box.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const row = document.createElement("div");
      row.className = "hex-row";

      const step = document.createElement("div");
      step.className = "step";
      step.textContent = stepName(ramp, i);

      const field = document.createElement("div");
      field.className = "field";
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "#RRGGBB";
      input.spellcheck = false;
      input.value = old[i] || "";
      input.addEventListener("input", validate);
      field.append(swatch, input);

      row.append(step, field);
      box.append(row);
    }
    // The section header carries the range, so the row labels don't have to be
    // read end-to-end to know what's being written.
    $("range").textContent = n ? stepName(ramp, 0) + " – " + stepName(ramp, n - 1) : "";
    validate();
  }

  function validate() {
    let ok = true;
    const collection = $("collection").value.trim();
    const ramp = $("ramp").value.trim();
    const rampBad = !ramp || ramp.includes("/");
    $("collection").classList.toggle("invalid", !collection);
    $("ramp").classList.toggle("invalid", rampBad);
    $("count").classList.toggle("invalid", countValue() === null);
    if (!collection || rampBad || countValue() === null) ok = false;
    const rows = document.querySelectorAll(".hex-row");
    if (rows.length === 0) ok = false;
    for (const row of rows) {
      const input = row.querySelector("input");
      const swatch = row.querySelector(".swatch");
      const value = input.value.trim();
      const valid = HEX_RE.test(value);
      // Pristine empty fields block Create but aren't flagged red.
      input.classList.toggle("invalid", value !== "" && !valid);
      // Clearing the inline style hands the chip back to its CSS empty state,
      // which is theme-aware — a hardcoded white would glare in dark mode.
      swatch.style.background = valid ? value : "";
      if (!valid) ok = false;
    }
    $("create").disabled = !ok;
    return ok;
  }

  $("ramp").addEventListener("input", renderHexRows);
  $("count").addEventListener("input", renderHexRows);
  $("collection").addEventListener("input", validate);

  function baseValue() {
    const value = $("base").value.trim();
    return HEX_RE.test(value) ? expandHex(value) : null;
  }

  $("base").addEventListener("input", () => {
    const value = $("base").value.trim();
    const valid = HEX_RE.test(value);
    $("base").classList.toggle("invalid", value !== "" && !valid);
    $("base-swatch").style.background = valid ? value : "";
    $("generate").disabled = baseValue() === null;
    // Keep the hidden picker on the current color so it opens where the typed
    // value left off. A color input only accepts 6-digit form, hence expandHex.
    if (valid) $("base-picker").value = expandHex(value);
  });

  // "input" rather than "change": it fires continuously while dragging, so the
  // chip tracks the picker live. No feedback loop — assigning .value above does
  // not fire input.
  $("base-picker").addEventListener("input", () => {
    setBase($("base-picker").value);
  });

  // Writes a hex in as though it had been typed, so #base's own listener does
  // the validating, the chip preview and the Fill toggle. Every path into the
  // base field goes through here; nothing gets its own copy of those rules.
  // Uppercased here, once, so every path agrees with the case generateRamp()
  // already writes into the hex rows — toHex() in code.js emits lowercase,
  // the picker used to uppercase at the call site. "".toUpperCase() is "",
  // so an empty reset value passes through unchanged.
  function setBase(hex) {
    $("base").value = hex.toUpperCase();
    $("base").dispatchEvent(new Event("input"));
  }

  $("pick").onclick = () => {
    parent.postMessage({ pluginMessage: { type: "pick-selection" } }, "*");
  };

  // Fills the visible rows from the generated ramp. Deliberately writes into
  // the same inputs rather than bypassing them, so every generated value stays
  // hand-editable and goes through the usual validation.
  $("generate").onclick = () => {
    const base = baseValue();
    if (!base) return;
    const ramp = generateRamp(base);
    document.querySelectorAll(".hex-row").forEach((row, i) => {
      row.querySelector("input").value = ramp[i];
      // Retrigger the chip animation on a re-fill: the class has to leave the
      // element and a layout be read before it counts as a new animation.
      row.classList.remove("filled");
      void row.offsetWidth;
      row.classList.add("filled");
    });
    validate();
  };

  function setStatus(text, failed) {
    const box = $("status");
    box.textContent = text;
    box.className = (text ? "shown" : "") + (failed ? " error" : "");
  }

  $("create").onclick = () => {
    if (!validate()) return;
    const ramp = $("ramp").value.trim();
    const entries = [...document.querySelectorAll(".hex-row input")].map((el, i) => ({
      name: stepName(ramp, i),
      hex: expandHex(el.value.trim()),
    }));
    $("create").disabled = true;
    setStatus("Working…", false);
    parent.postMessage({ pluginMessage: {
      type: "create-ramp",
      collection: $("collection").value.trim(),
      ramp: ramp,
      entries: entries,
      sheet: $("sheet").checked,
    } }, "*");
  };

  // Back to a blank form after a successful run. The hex rows are emptied
  // first because renderHexRows() deliberately carries typed values over by
  // position — without this, every hex would survive the reset.
  function resetForm() {
    $("collection").value = "";
    $("ramp").value = "";
    $("count").value = LADDER.length;
    setBase("");
    $("base-picker").value = "#ff4252";
    $("sheet").checked = false;
    $("hexes").innerHTML = "";
    renderHexRows();
  }

  // One branch per message code.js can send, and nothing after them. The old
  // shape — "if it isn't an error, the run finished" — was true only while
  // create-ramp was the only thing that replied. Falling through to resetForm()
  // on an unrecognised message means any future message type silently wipes the
  // form, so an unknown type must do nothing at all.
  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "picked") { setBase(msg.hex); return; }
    if (msg.type === "error") { setStatus(msg.message, true); validate(); return; }
    // Success resets the form. On failure it is left exactly as it was, so the
    // values can be corrected and resubmitted rather than retyped.
    if (msg.type === "done") { setStatus(msg.summary, false); resetForm(); return; }
  };

  renderHexRows();
</script>
